<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1b33">
<title>Cathy's Property Bible &middot; Sign In</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">&#8962;</span>
        <span>Cathy's Property Bible</span>
      </div>
      <form id="login-form">
        <div id="login-error" class="login-error" hidden></div>
        <div class="field full">
          <label for="f-username">Username</label>
          <input id="f-username" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="field full">
          <label for="f-password">Password</label>
          <input id="f-password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary login-submit">Sign In</button>
      </form>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
